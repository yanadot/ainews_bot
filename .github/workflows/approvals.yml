name: approvals

# Light run: handle «В канал» / «Мимо» / replies. No Claude here.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram          # shared with ai-news.yml
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Process Telegram actions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python3 scripts/approvals.py

      - name: Commit state
        if: always()
        run: bash scripts/commit_state.sh "state: approvals"
