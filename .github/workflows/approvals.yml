name: approvals

# Handle Telegram actions: topic picks from the digest, «В канал» / «Мимо», replies.
# If a topic was picked, Sonnet writes the post and the draft goes to the admin chat.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram          # shared with ai-news.yml
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process Telegram actions
        id: approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python3 scripts/approvals.py

      - uses: actions/setup-node@v4
        if: steps.approvals.outputs.has_queue == 'true'
        with:
          node-version: "20"

      - name: Sonnet writes the post
        id: claude
        if: steps.approvals.outputs.has_queue == 'true'
        timeout-minutes: 10
        env:
          # Only the API key. The bot token is never passed to this step.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'sonnet' }}
        run: |
          npm install -g @anthropic-ai/claude-code
          bash scripts/write_posts.sh

      - name: Send drafts
        if: steps.approvals.outputs.has_queue == 'true' && steps.claude.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python3 scripts/send_drafts.py

      - name: Commit state
        if: always()
        run: bash scripts/commit_state.sh "state - approvals"
